<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Statement Portal - Income Tax Statement &amp; CRM System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --dark: #0f172a;
  --dark-surface: #1e293b;
  --dark-border: #334155;
  --border: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --radius: 16px;
  --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', -apple-system, sans-serif; }

body {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #fff;
}

.login-container {
  width: 100%;
  max-width: 440px;
  background: rgba(30, 41, 59, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 36px 32px;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.brand-logo {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 24px;
  color: #fff;
  box-shadow: 0 8px 20px rgba(37,99,235,0.4);
  margin-bottom: 12px;
}

.brand-header h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.brand-header p {
  font-size: 13px;
  color: #94a3b8;
}

.dept-presets {
  margin-bottom: 24px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--dark-border);
  border-radius: 12px;
  padding: 12px;
}

.dept-presets-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #94a3b8;
  margin-bottom: 8px;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.preset-btn {
  background: #334155;
  border: 1px solid transparent;
  color: #e2e8f0;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
}
.preset-btn:hover {
  background: #475569;
  border-color: #3b82f6;
  color: #fff;
}
.preset-btn .preset-dept {
  font-size: 10px;
  color: #94a3b8;
  font-weight: 500;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #cbd5e1;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.input-wrap {
  position: relative;
}

.form-group input {
  width: 100%;
  background: #0f172a;
  border: 1px solid var(--dark-border);
  color: #fff;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s ease;
}

.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
}

.alert-error {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.alert-error.show { display: block; }

.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 14px rgba(37,99,235,0.35);
  margin-top: 6px;
}

.submit-btn:hover {
  background: linear-gradient(135deg, #1d4ed8, #1e40af);
  transform: translateY(-1px);
}

.footer-note {
  text-align: center;
  font-size: 11px;
  color: #64748b;
  margin-top: 24px;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="brand-header">
    <div class="brand-logo">%</div>
    <h2>Tax Statement Portal</h2>
    <p>Income Tax Statement &amp; CRM System</p>
  </div>



  <div class="alert-error" id="errorAlert"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Username / Department ID</label>
      <input type="text" id="username" placeholder="Enter username" required>
    </div>

    <div class="form-group">
      <label>Passcode / Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>

    <button type="submit" class="submit-btn">Sign In to Department</button>
  </form>

  <div style="margin-top:18px; padding-top:16px; border-top:1px solid #334155; display:flex; gap:10px;">
    <button type="button" class="btn" style="flex:1; border:1px solid #38bdf8; color:#38bdf8; font-size:12px; font-weight:700; padding:10px; background:rgba(56,189,248,0.1); border-radius:8px; cursor:pointer;" onclick="openPublicRequestModal()">
      📝 Request Statement
    </button>
    <button type="button" class="btn" style="flex:1; border:1px solid #fbbf24; color:#fbbf24; font-size:12px; font-weight:700; padding:10px; background:rgba(251,191,36,0.1); border-radius:8px; cursor:pointer;" onclick="openTrackModal()">
      🔍 Track Status
    </button>
  </div>

  <div class="footer-note">
    BRAC Institute of Educational Development (BRAC IED)<br>
    <span style="font-weight:600; color:#38bdf8; font-size:11px; margin-top:4px; display:inline-block;">Developer: Wasik Ahmed Khan</span>
  </div>
</div>

<!-- Public Employee Request Modal -->
<div class="modal-overlay" id="publicRequestModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); z-index:300; align-items:center; justify-content:center;">
  <div style="background:#0f172a; border:1px solid #334155; border-radius:14px; width:480px; max-width:90%; padding:24px; color:#e2e8f0; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:12px; margin-bottom:16px;">
      <h3 style="color:#38bdf8; font-size:16px; margin:0; font-weight:700;">📝 Request Income Tax Statement</h3>
      <button style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;" onclick="closePublicRequestModal()">&times;</button>
    </div>
    <form onsubmit="handlePublicRequestSubmit(event)">
      <div style="margin-bottom:12px;">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">Main PIN Number *</label>
        <input type="text" id="reqPin" placeholder="Enter Employee PIN" required style="width:100%; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#fff; border-radius:6px; font-size:13px;">
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">Full Name *</label>
        <input type="text" id="reqName" placeholder="Enter Full Name" required style="width:100%; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#fff; border-radius:6px; font-size:13px;">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
        <div>
          <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">Designation</label>
          <input type="text" id="reqDesignation" placeholder="Designation" style="width:100%; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#fff; border-radius:6px; font-size:13px;">
        </div>
        <div>
          <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">TIN Number</label>
          <input type="text" id="reqTin" placeholder="12-Digit TIN" style="width:100%; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#fff; border-radius:6px; font-size:13px;">
        </div>
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">Notification Email Address *</label>
        <input type="email" id="reqEmail" placeholder="your.name@brac.net" required style="width:100%; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#fff; border-radius:6px; font-size:13px;">
      </div>
      <div style="margin-bottom:16px;">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">Fiscal Year</label>
        <select id="reqFy" style="width:100%; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#38bdf8; font-weight:700; border-radius:6px; font-size:13px;">
          <option value="2025-2026">FY 2025-2026</option>
          <option value="2024-2025">FY 2024-2025</option>
        </select>
      </div>
      <button type="submit" class="submit-btn" style="background:#2563eb;">Submit Tax Statement Request</button>
    </form>
  </div>
</div>

<!-- Public Tracking Modal -->
<div class="modal-overlay" id="trackModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); z-index:300; align-items:center; justify-content:center;">
  <div style="background:#0f172a; border:1px solid #334155; border-radius:14px; width:460px; max-width:90%; padding:24px; color:#e2e8f0; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:12px; margin-bottom:16px;">
      <h3 style="color:#fbbf24; font-size:16px; margin:0; font-weight:700;">🔍 Track Request Progress</h3>
      <button style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;" onclick="closeTrackModal()">&times;</button>
    </div>
    <form onsubmit="handleTrackSubmit(event)">
      <div style="margin-bottom:12px;">
        <label style="font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; display:block; margin-bottom:4px;">Enter PIN or Request ID</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="trackQuery" placeholder="e.g. 10100 or REQ-2026..." required style="flex:1; padding:8px 12px; border:1px solid #334155; background:#1e293b; color:#fff; border-radius:6px; font-size:13px;">
          <button type="submit" class="submit-btn" style="width:auto; padding:8px 16px; background:#f59e0b;">Search</button>
        </div>
      </div>
    </form>
    <div id="trackResultContainer" style="margin-top:16px; display:none; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:14px;">
    </div>
  </div>
</div>

<script>
function fillLogin(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  document.getElementById('errorAlert').classList.remove('show');
}

function openPublicRequestModal() {
  document.getElementById('publicRequestModal').style.display = 'flex';
}
function closePublicRequestModal() {
  document.getElementById('publicRequestModal').style.display = 'none';
}
function openTrackModal() {
  document.getElementById('trackModal').style.display = 'flex';
}
function closeTrackModal() {
  document.getElementById('trackModal').style.display = 'none';
}

async function handlePublicRequestSubmit(e) {
  e.preventDefault();
  const payload = {
    pin: document.getElementById('reqPin').value.trim(),
    name: document.getElementById('reqName').value.trim(),
    designation: document.getElementById('reqDesignation').value.trim(),
    tin: document.getElementById('reqTin').value.trim(),
    email: document.getElementById('reqEmail').value.trim(),
    fiscal_year: document.getElementById('reqFy').value
  };

  try {
    const resp = await fetch('/api/request-statement', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (data.error) { alert('Error: ' + data.error); return; }
    alert('✅ Request Submitted Successfully!\nTracking ID: ' + data.request.req_id + '\nAn email update will be sent when your statement is prepared.');
    closePublicRequestModal();
  } catch (err) {
    alert('Submission error: ' + err.message);
  }
}

async function handleTrackSubmit(e) {
  e.preventDefault();
  const q = document.getElementById('trackQuery').value.trim();
  const container = document.getElementById('trackResultContainer');
  try {
    const resp = await fetch('/api/request-statement/track/' + encodeURIComponent(q));
    const data = await resp.json();
    if (data.error) {
      container.style.display = 'block';
      container.innerHTML = '<div style="color:#f87171; font-weight:700; font-size:13px;">❌ ' + data.error + '</div>';
      return;
    }
    const r = data.request;
    let badgeColor = '#f59e0b';
    if (r.status === 'Ready for Pickup') badgeColor = '#10b981';
    if (r.status === 'Completed') badgeColor = '#3b82f6';

    let html = '<div style="font-size:12px;">';
    html += '<div style="font-weight:700; color:#38bdf8; font-size:13px; margin-bottom:6px;">Request ID: ' + r.req_id + '</div>';
    html += '<div><strong>PIN:</strong> ' + r.pin + ' | <strong>Name:</strong> ' + r.name + '</div>';
    html += '<div><strong>Fiscal Year:</strong> ' + r.fiscal_year + '</div>';
    html += '<div style="margin-top:10px; background:#0f172a; padding:8px 12px; border-radius:6px; border:1px solid #334155; display:flex; justify-content:space-between; align-items:center;">';
    html += '<span style="color:#94a3b8; font-weight:700;">CURRENT STATUS:</span>';
    html += '<span style="background:' + badgeColor + '; color:#0f172a; font-weight:800; padding:2px 8px; border-radius:10px;">' + r.status + '</span>';
    html += '</div>';
    if (r.status === 'Ready for Pickup') {
      html += '<div style="color:#10b981; font-weight:700; margin-top:8px; font-size:11px;">🎉 Statement is printed and ready for pickup at HR!</div>';
    }
    html += '</div>';

    container.style.display = 'block';
    container.innerHTML = html;
  } catch (err) {
    container.style.display = 'block';
    container.innerHTML = '<div style="color:#f87171;">Error tracking request: ' + err.message + '</div>';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const errBox = document.getElementById('errorAlert');

  errBox.classList.remove('show');

  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await resp.json();

    if (data.error) {
      errBox.textContent = data.error;
      errBox.classList.add('show');
      return;
    }

    if (data.success) {
      window.location.href = '/';
    }
  } catch (err) {
    errBox.textContent = 'Login connection error: ' + err.message;
    errBox.classList.add('show');
  }
}
</script>
</body>
</html>
