<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Statement Portal - Income Tax Statement &amp; CRM System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --dark: #0f172a;
  --dark-surface: #1e293b;
  --dark-border: #334155;
  --border: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --radius: 16px;
  --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', -apple-system, sans-serif; }

body {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #fff;
}

.login-container {
  width: 100%;
  max-width: 440px;
  background: rgba(30, 41, 59, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 36px 32px;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.brand-logo {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 24px;
  color: #fff;
  box-shadow: 0 8px 20px rgba(37,99,235,0.4);
  margin-bottom: 12px;
}

.brand-header h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.brand-header p {
  font-size: 13px;
  color: #94a3b8;
}

.dept-presets {
  margin-bottom: 24px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--dark-border);
  border-radius: 12px;
  padding: 12px;
}

.dept-presets-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #94a3b8;
  margin-bottom: 8px;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.preset-btn {
  background: #334155;
  border: 1px solid transparent;
  color: #e2e8f0;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
}
.preset-btn:hover {
  background: #475569;
  border-color: #3b82f6;
  color: #fff;
}
.preset-btn .preset-dept {
  font-size: 10px;
  color: #94a3b8;
  font-weight: 500;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #cbd5e1;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.input-wrap {
  position: relative;
}

.form-group input {
  width: 100%;
  background: #0f172a;
  border: 1px solid var(--dark-border);
  color: #fff;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s ease;
}

.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
}

.alert-error {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.alert-error.show { display: block; }

.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 14px rgba(37,99,235,0.35);
  margin-top: 6px;
}

.submit-btn:hover {
  background: linear-gradient(135deg, #1d4ed8, #1e40af);
  transform: translateY(-1px);
}

.footer-note {
  text-align: center;
  font-size: 11px;
  color: #64748b;
  margin-top: 24px;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="brand-header">
    <div class="brand-logo">%</div>
    <h2>Tax Statement Portal</h2>
    <p>Income Tax Statement &amp; CRM System</p>
  </div>



  <div class="alert-error" id="errorAlert"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Username / Department ID</label>
      <input type="text" id="username" placeholder="Enter username" required>
    </div>

    <div class="form-group">
      <label>Passcode / Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>

    <button type="submit" class="submit-btn">Sign In to Department</button>
  </form>

  <div class="footer-note">
    BRAC Institute of Educational Development (BRAC IED)<br>
    <span style="font-weight:600; color:#38bdf8; font-size:11px; margin-top:4px; display:inline-block;">Developer: Wasik Ahmed Khan</span>
  </div>
</div>

<script>
function fillLogin(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  document.getElementById('errorAlert').classList.remove('show');
}

async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const errBox = document.getElementById('errorAlert');

  errBox.classList.remove('show');

  try {
    const resp = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await resp.json();

    if (data.error) {
      errBox.textContent = data.error;
      errBox.classList.add('show');
      return;
    }

    if (data.success) {
      window.location.href = '/';
    }
  } catch (err) {
    errBox.textContent = 'Login connection error: ' + err.message;
    errBox.classList.add('show');
  }
}
</script>
</body>
</html>
